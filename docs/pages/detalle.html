<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css" />
    <title>DWEC04 - WaveWatch - Detalles del Spot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div>
            <h1 id="detalle-nombre">Cargando spot...</h1>
            <h2 id="detalle-provincia">Previsión marítima</h2>
        </div>
    </header>

    <main class="contenedor">
        <!-- Barra superior con botón volver -->
        <div class="barra-navegacion">
            <button id="btn-volver" class="btn-detail">⬅ Volver al listado</button>
        </div>

        <!-- Ficha del spot (reutiliza estilo caja blanca) -->
        <section class="detalle-box">
            <div class="detalle-box-header">
                <h3>Información del Spot</h3>
                <span id="detalle-nivel" class="badge"></span>
            </div>
            <p id="detalle-descripcion" class="detalle-desc"></p>
        </section>

        <!-- Sección del gráfico interactivo -->
        <section class="detalle-box">
            <div class="detalle-box-header">
                <h3>Previsión por horas</h3>
                <div class="controles-grafico">
                    <button class="btn-rango active" data-dias="1">Próximas 24h</button>
                    <button class="btn-rango" data-dias="3">Próximos 3 días</button>
                </div>
            </div>
            <div class="contenedor-canvas">
                <!--<canvas id="mi-grafico"></canvas>   Ahora lo creo en detalle.ui.js--> 
            </div>
        </section>
    </main>

    <footer>
        <!--<p>DWEC04 - WaveWatch | Datos proporcionados por Open-Meteo</p>-->
        <p>&copy; 2026 WaveWatch - DWEC04 TE1 - Mikel Granada (Datos proporcionados por Open-Meteo)</p>
    </footer>

    <script type="text/javascript" src="../js/lib/jquery_3.7.1.js"></script>
    <script type="module" src="../js/detalle.js"></script>
</body>
</html>
